<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131c">
  <meta name="description" content="Offline Act 1 guide for Slay the Spire 2: enemies, turn cycles, elites and bosses.">
  <title>Spire 2 Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Spire 2 Guide</a>
    <nav>
      <a href="#/search" aria-label="Search enemies">Search</a>
      <a href="#/info" aria-label="Registry and diagnostics">Info</a>
      <button id="new-run" type="button" class="danger">New run</button>
    </nav>
  </header>
  <main id="app" tabindex="-1">
    <p class="muted">Loading…</p>
    <noscript><p>This guide needs JavaScript switched on.</p></noscript>
  </main>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2>Start a new run?</h2>
      <p>This clears your character, map, ascension, chosen boss and all turn counters. Your personal enemy notes are kept.</p>
      <div class="row">
        <button value="cancel" type="submit">Cancel</button>
        <button value="ok" type="submit" class="danger">Clear run</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
